name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        mg5: ["3.8.0", "3.8.1", "3.8.2"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: install python and ghostscript dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript
          python -m pip install six

      - name: get MG5aMC ${{ matrix.mg5 }}
        env:
          MG5_VERSION: ${{ matrix.mg5 }}
        run: |
          # Only 3.8.1 is published as a Launchpad tarball; all 3.8.x
          # releases are available as GitHub branch archives.
          url="https://codeload.github.com/mg5amcnlo/mg5amcnlo/tar.gz/refs/heads/${MG5_VERSION}"
          wget -q "$url" -O "mg5.tar.gz"
          mkdir "MG5_aMC_v${MG5_VERSION//./_}"
          tar -xzf mg5.tar.gz -C "MG5_aMC_v${MG5_VERSION//./_}" --strip-components=1
          echo "MG5DIR=$PWD/MG5_aMC_v${MG5_VERSION//./_}" >> "$GITHUB_ENV"

      - name: install plugin
        run: bash ./install.sh --mg5 "$MG5DIR" --from-local

      - name: run tests
        run: |
          PYTHONPATH="$PWD:$MG5DIR" \
            python -m unittest discover -s tests -p 'test_*.py' -v
